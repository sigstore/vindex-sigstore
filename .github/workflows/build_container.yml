name: Build and publish vindexd artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository }}

permissions: {}

concurrency:
  group: "build-container-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-push-vindexd:
    name: Build and push vindexd image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for vindexd
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/vindexd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Set build arguments
        run: |
          LDFLAGS=$(make ldflags)
          echo "LDFLAGS=$LDFLAGS" >> $GITHUB_ENV

      - name: Build and push per-commit vindexd image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: push-per-commit
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          target: local-deploy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_LDFLAGS=${{ env.LDFLAGS }}

      - name: Build and push per-tag vindexd image
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: push-per-tag
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          target: deploy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_LDFLAGS=${{ env.LDFLAGS }}

      - name: Generate artifact attestation (per-commit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/vindexd
          subject-digest: ${{ steps.push-per-commit.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (per-tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/vindexd
          subject-digest: ${{ steps.push-per-tag.outputs.digest }}
          push-to-registry: true
